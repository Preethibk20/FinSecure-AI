<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSecure AI - Budget Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
        }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .amount { font-size: 2em; font-weight: bold; color: #333; }
        .rupee { font-family: Arial, sans-serif; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .transaction-list { max-height: 400px; overflow-y: auto; }
        .transaction-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <div class="header">
            <h1>📊 FinSecure AI - Budget Tracker</h1>
            <p>Track your income, expenses, and achieve your financial goals</p>
        </div>
        <div class="dashboard">
            <div class="stat-card">
                <h3>Total Income</h3>
                <div class="amount rupee" id="totalIncome" style="color: #00d77f;">₹0.00</div>
            </div>
            <div class="stat-card">
                <h3>Total Expenses</h3>
                <div class="amount rupee" id="totalExpenses" style="color: #ff5252;">₹0.00</div>
            </div>
            <div class="stat-card">
                <h3>Balance</h3>
                <div class="amount rupee" id="balance">₹0.00</div>
            </div>
        </div>
        <div class="card">
            <h2>Add Transaction</h2>
            <form id="transactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label>Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" step="0.01" min="0" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="description" required>
                </div>
                <button type="submit" class="btn">Add Transaction</button>
            </form>
        </div>
        <div class="card">
            <h2>Recent Transactions</h2>
            <div class="transaction-list" id="transactionList">
                <p style="text-align: center; color: #999; padding: 40px;">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>
    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        function updateDashboard() {
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            document.getElementById('totalIncome').textContent = `₹${income.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('totalExpenses').textContent = `₹${expenses.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('balance').textContent = `₹${(income - expenses).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }
        function renderTransactions() {
            const container = document.getElementById('transactionList');
            if (transactions.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No transactions yet.</p>';
                return;
            }
            container.innerHTML = transactions.map(t => `
                <div class="transaction-item">
                    <div>
                        <strong>${t.description}</strong><br>
                        <small style="color: #999;">${new Date(t.date).toLocaleDateString('en-IN')}</small>
                    </div>
                    <div style="font-size: 1.2em; font-weight: bold; color: ${t.type === 'income' ? '#00d77f' : '#ff5252'};">
                        ${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                    </div>
                </div>
            `).join('');
        }
        function addTransaction(e) {
            e.preventDefault();
            const transaction = {
                id: Date.now(),
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                date: new Date().toISOString()
            };
            transactions.unshift(transaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            e.target.reset();
            updateDashboard();
            renderTransactions();
        }
        updateDashboard();
        renderTransactions();
    </script>
</body>
</html>
